<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Research Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .step-done  { color: #22c55e; }
    .step-error { color: #ef4444; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .spinner { border: 2px solid #e5e7eb; border-top-color: #6366f1; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="max-w-5xl mx-auto flex items-center gap-3">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white text-sm font-bold">AI</div>
      <div>
        <h1 class="text-base font-semibold text-gray-900">AI Research Agent</h1>
        <p class="text-xs text-gray-400">Autonomous web research · powered by Llama 3.3 + Playwright</p>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-5xl mx-auto px-6 py-8">

    <!-- Search -->
    <div class="bg-white rounded-xl border border-gray-200 p-5 mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">What are you researching?</label>
      <div class="flex gap-3">
        <input
          id="queryInput"
          type="text"
          placeholder="e.g. best lightweight laptop under ₹90k for ML"
          class="flex-1 border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          value="best lightweight laptop under 90000 for ML"
        />
        <select id="maxResults" class="border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="2">2 results</option>
          <option value="3" selected>3 results</option>
          <option value="4">4 results</option>
        </select>
        <button
          id="searchBtn"
          onclick="runResearch()"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors"
        >
          Research
        </button>
      </div>
    </div>

    <!-- Two column layout -->
    <div class="grid grid-cols-3 gap-5">

      <!-- Left: Agent Steps -->
      <div class="col-span-1">
        <div class="bg-white rounded-xl border border-gray-200 p-4">
          <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Agent Steps</h2>
          <div id="stepsPanel" class="space-y-2 text-sm text-gray-400">
            <p class="text-xs">Steps will appear here when you run a search.</p>
          </div>
        </div>
      </div>

      <!-- Right: Results -->
      <div class="col-span-2 space-y-4">

        <!-- Summary -->
        <div id="summaryBox" class="hidden bg-indigo-50 border border-indigo-100 rounded-xl p-4">
          <h2 class="text-xs font-semibold text-indigo-400 uppercase tracking-wide mb-2">Summary</h2>
          <p id="summaryText" class="text-sm text-gray-700 leading-relaxed"></p>
        </div>

        <!-- Products -->
        <div id="productsPanel" class="space-y-3"></div>

        <!-- Empty state -->
        <div id="emptyState" class="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400 text-sm">
          Results will appear here after research completes.
        </div>

      </div>
    </div>
  </main>

  <script>
    const API = window.location.origin;

    async function runResearch() {
      const query = document.getElementById('queryInput').value.trim();
      const maxResults = parseInt(document.getElementById('maxResults').value);
      if (!query) return;

      // Reset UI
      setSteps([]);
      document.getElementById('productsPanel').innerHTML = '';
      document.getElementById('summaryBox').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');

      // Disable button + show spinner
      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner mr-2"></span>Researching...';
      btn.classList.add('opacity-70');

      // Show live steps
      const liveSteps = ['Planner thinking...', 'Searching the web...', 'Visiting pages...', 'Analyzing with AI...', 'Writing summary...'];
      let stepIdx = 0;
      const stepTimer = setInterval(() => {
        if (stepIdx < liveSteps.length) {
          addStep(liveSteps[stepIdx], 'running');
          stepIdx++;
        }
      }, 2500);

      try {
        const res = await fetch(`${API}/research/full`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, max_results: maxResults }),
        });
        const data = await res.json();

        clearInterval(stepTimer);

        // Render real steps
        setSteps(data.steps_completed || []);

        // Render summary
        if (data.summary) {
          document.getElementById('summaryText').textContent = data.summary;
          document.getElementById('summaryBox').classList.remove('hidden');
        }

        // Render products
        const panel = document.getElementById('productsPanel');
        if (data.products && data.products.length > 0) {
          data.products.forEach((p, i) => {
            panel.innerHTML += buildCard(p, i + 1);
          });
        } else {
          document.getElementById('emptyState').classList.remove('hidden');
          document.getElementById('emptyState').textContent = 'No products extracted. Try a different query.';
        }

      } catch (err) {
        clearInterval(stepTimer);
        addStep('Error: ' + err.message, 'error');
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('emptyState').textContent = 'Could not connect to server. Make sure it is running on port 8000.';
      }

      // Re-enable button
      btn.disabled = false;
      btn.textContent = 'Research';
      btn.classList.remove('opacity-70');
    }

    function buildCard(p, idx) {
      const field = (label, val) => val
        ? `<div class="flex gap-2 text-xs"><span class="text-gray-400 w-16 shrink-0">${label}</span><span class="text-gray-700">${val}</span></div>`
        : '';

      return `
        <div class="bg-white rounded-xl border border-gray-200 p-4 fade-in">
          <div class="flex items-start justify-between mb-3">
            <div>
              <span class="text-xs text-indigo-500 font-medium">#${idx}</span>
              <h3 class="text-sm font-semibold text-gray-900 mt-0.5">${p.name || 'Unknown Product'}</h3>
            </div>
            ${p.price ? `<span class="text-sm font-semibold text-green-600 bg-green-50 px-2 py-0.5 rounded-full">${p.price}</span>` : ''}
          </div>
          <div class="space-y-1.5">
            ${field('CPU', p.cpu)}
            ${field('GPU', p.gpu)}
            ${field('RAM', p.ram)}
            ${field('Storage', p.storage)}
            ${field('Display', p.display)}
            ${field('Battery', p.battery)}
            ${field('Weight', p.weight)}
            ${field('OS', p.os)}
          </div>
          ${p.source_url ? `<a href="${p.source_url}" target="_blank" class="mt-3 inline-block text-xs text-indigo-500 hover:underline">View source →</a>` : ''}
        </div>`;
    }

    function setSteps(steps) {
      const panel = document.getElementById('stepsPanel');
      if (!steps.length) { panel.innerHTML = '<p class="text-xs text-gray-400">Waiting...</p>'; return; }
      panel.innerHTML = steps.map(s => {
        const isError = s.includes('error') || s.includes('failed');
        const cls = isError ? 'step-error' : 'step-done';
        const icon = isError ? '✕' : '✓';
        return `<div class="flex gap-2 text-xs ${cls} fade-in"><span>${icon}</span><span>${s}</span></div>`;
      }).join('');
    }

    function addStep(text, type) {
      const panel = document.getElementById('stepsPanel');
      if (panel.querySelector('p')) panel.innerHTML = '';
      const cls = type === 'error' ? 'step-error' : type === 'running' ? 'text-gray-400' : 'step-done';
      const icon = type === 'error' ? '✕' : type === 'running' ? '·' : '✓';
      panel.innerHTML += `<div class="flex gap-2 text-xs ${cls} fade-in"><span>${icon}</span><span>${text}</span></div>`;
    }

    // Allow Enter key to search
    document.getElementById('queryInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') runResearch();
    });
  </script>

</body>
</html>
